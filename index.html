<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад занять МППК</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            background-color: white;
            cursor: pointer;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .schedule-table th, .schedule-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .schedule-table th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        .schedule-table tr:hover {
            background-color: #f8f9fa;
        }

        .cabinet {
            display: inline-block;
            background-color: #e8f4fd;
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            margin-left: 5px;
        }

        @media (max-width: 768px) {
            .schedule-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>

    function renderSchedule() {
        const group = document.getElementById('groupSelect').value;
        const tbody = document.getElementById('scheduleBody');
        tbody.innerHTML = '';

        const groupData = scheduleData[group];
        if (!groupData) {
            tbody.innerHTML = '<tr><td colspan="6">Дані відсутні</td></tr>';
            return;
        }

        groupData.forEach(row => {
            const tr = document.createElement('tr');
            
            let html = `<td><strong>${row.num}</strong></td>`;
            row.days.forEach(dayText => {
                let formattedText = dayText.replace(/\((\d+[\/\d]*)\)/g, '<span class="cabinet">каб. $1</span>');
                html += `<td>${formattedText}</td>`;
            });

            tr.innerHTML = html;
            tbody.appendChild(tr);
        });
    }

    // Початковий рендер
    renderSchedule();
